<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Convertisseur EUR → MAD</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Convertisseur Euro vers Dirham marocain</h1>
      <p>Entrez un montant en euros. Le calcul applique ensuite une majoration de 1,5% sur le montant converti en dirhams.</p>

      <form id="converter-form">
        <label for="eur">Montant en euros (€)</label>
        <input id="eur" name="eur" type="number" min="0" step="0.01" placeholder="Ex: 100" required />

        <label for="rate">Taux de conversion (1€ = ? MAD)</label>
        <input id="rate" name="rate" type="number" min="0" step="0.0001" value="10.8" required />

        <button type="submit">Convertir</button>
      </form>

      <section id="result" class="result" aria-live="polite" hidden>
        <h2>Résultat</h2>
        <p><strong>Montant converti:</strong> <span id="mad-amount"></span> MAD</p>
        <p><strong>Majoration (1,5%):</strong> <span id="markup"></span> MAD</p>
        <p><strong>Total final:</strong> <span id="total"></span> MAD</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
